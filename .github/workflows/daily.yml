name: daily-short

on:
  schedule:
    - cron: "0 8,20 * * *"  # 2x daily: 08:00 + 20:00 UTC (~2-min Short, still a YouTube Short)
  workflow_dispatch: {}  # manual Run button

# Runs stay serial: history.json is committed back each run, so overlapping
# runs could repeat a story or clash on push. Serial also avoids
# YouTube upload-quota spikes and artifact name clashes.
concurrency:
  group: shorts-single
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # write = commit history.json back so next run avoids repeats
    env:
      VISIBILITY: ${{ vars.VISIBILITY || 'private' }}
      TTS_RATE: ${{ vars.TTS_RATE || '-5%' }}
      TTS_PITCH: ${{ vars.TTS_PITCH || '-10Hz' }}
      TTS_VOLUME: ${{ vars.TTS_VOLUME || '+0%' }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'gemini' }}
      GEMINI_TTS_VOICES: ${{ vars.GEMINI_TTS_VOICES || 'Charon' }}
      GEMINI_TTS_STYLE: ${{ vars.GEMINI_TTS_STYLE }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      AI_TOPICS: ${{ vars.AI_TOPICS || 'on' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run pipeline
        run: python pipeline.py
      - name: Commit history (dedup memory for next run)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "chore: record short history [skip ci]"
          git push || echo "history push skipped (nothing to push or no write access)"
      - name: Keep metadata (always, 90 days, tiny text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-metadata
          path: out/*.json
          retention-days: 90
          if-no-files-found: warn
      - name: Keep video (only on failure, 3 days, debug only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: short-video-debug
          path: |
            out/*.mp4
            out/*.mp3
            out/*.srt
          retention-days: 3
          if-no-files-found: warn
