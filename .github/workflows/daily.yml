name: daily-short

on:
  schedule:
    - cron: "0 8,20 * * *"  # 2x daily: 08:00 + 20:00 UTC (~2-min Short, still a YouTube Short)
  workflow_dispatch: {}  # manual Run button

# Runs stay serial: history.json is committed back each run, so overlapping
# runs could repeat a story or clash on push. Serial also avoids
# YouTube upload-quota spikes and artifact name clashes.
concurrency:
  group: shorts-single
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # write = commit history.json back so next run avoids repeats
    env:
      # Single-niche default; to run several niches, fan out with a matrix
      # (e.g. `strategy.matrix.niche: [story, explainer, ranking]`) and set
      # NICHE: ${{ matrix.niche }} instead.
      NICHE: ${{ vars.NICHE || 'story' }}
      VISIBILITY: ${{ vars.VISIBILITY || 'private' }}
      TTS_RATE: ${{ vars.TTS_RATE || '-5%' }}
      TTS_PITCH: ${{ vars.TTS_PITCH || '-10Hz' }}
      TTS_VOLUME: ${{ vars.TTS_VOLUME || '+0%' }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'edge' }}
      GEMINI_TTS_VOICES: ${{ vars.GEMINI_TTS_VOICES || 'Charon' }}
      GEMINI_TTS_STYLE: ${{ vars.GEMINI_TTS_STYLE }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_TIMEOUT: ${{ vars.GEMINI_TIMEOUT || '40' }}
      GEMINI_TTS_TIMEOUT: ${{ vars.GEMINI_TTS_TIMEOUT || '90' }}
      GEMINI_TRIES: ${{ vars.GEMINI_TRIES || '2' }}
      GEMINI_BACKOFF: ${{ vars.GEMINI_BACKOFF || '5' }}
      AI_TOPICS: ${{ vars.AI_TOPICS || 'on' }}
      EXPLAINER_STILLS_PER_BEAT: ${{ vars.EXPLAINER_STILLS_PER_BEAT || '2' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      TTS_MODEL: ${{ vars.TTS_MODEL || 'gemini-3.1-flash-tts-preview' }}
      TTS_VOICES: ${{ vars.TTS_VOICES }}
      NARRATION_SPEED: ${{ vars.NARRATION_SPEED || '1.15' }}
      BG_DIR: ${{ vars.BG_DIR || 'assets/backgrounds/' }}
      SEG_MIN: ${{ vars.SEG_MIN || '2.0' }}
      SEG_MAX: ${{ vars.SEG_MAX || '4.0' }}
      BG_SPEED_MIN: ${{ vars.BG_SPEED_MIN || '2.5' }}
      BG_SPEED_MAX: ${{ vars.BG_SPEED_MAX || '3.5' }}
      CAPTION_UPPER: ${{ vars.CAPTION_UPPER || '0' }}
      CARD_SECONDS: ${{ vars.CARD_SECONDS || '3.0' }}
      CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
      AVATAR_PATH: ${{ vars.AVATAR_PATH || 'assets/avatar.png' }}
      MAX_SECONDS: ${{ vars.MAX_SECONDS || '45' }}
      STORY_GENRES: ${{ vars.STORY_GENRES }}
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'base' }}
      STORY_TTS_MODEL: ${{ vars.STORY_TTS_MODEL || vars.TTS_MODEL || 'gemini-2.5-flash-preview-tts' }}
      STORY_TTS_MODELS: ${{ vars.STORY_TTS_MODELS }}
      STORY_MODELS: ${{ vars.STORY_MODELS }}
      STORY_TTS_VOICES: ${{ vars.STORY_TTS_VOICES }}
      STORY_NARRATION_SPEED: ${{ vars.STORY_NARRATION_SPEED }}
      STORY_SEG_MIN: ${{ vars.STORY_SEG_MIN }}
      STORY_SEG_MAX: ${{ vars.STORY_SEG_MAX }}
      STORY_BG_SPEED_MIN: ${{ vars.STORY_BG_SPEED_MIN }}
      STORY_BG_SPEED_MAX: ${{ vars.STORY_BG_SPEED_MAX }}
      STORY_CLEANING_CLIPS_PER_QUERY: ${{ vars.STORY_CLEANING_CLIPS_PER_QUERY }}
      STORY_CLEANING_SHARE: ${{ vars.STORY_CLEANING_SHARE }}
      STORY_CAPTION_UPPER: ${{ vars.STORY_CAPTION_UPPER }}
      STORY_CARD_SECONDS: ${{ vars.STORY_CARD_SECONDS }}
      STORY_CHANNEL_HANDLE: ${{ vars.STORY_CHANNEL_HANDLE }}
      STORY_AVATAR_PATH: ${{ vars.STORY_AVATAR_PATH }}
      STORY_CARD_LIKES: ${{ vars.STORY_CARD_LIKES }}
      STORY_CARD_SHARES: ${{ vars.STORY_CARD_SHARES }}
      STORY_CARD_SHOW_REACTIONS: ${{ vars.STORY_CARD_SHOW_REACTIONS }}
      STORY_BG_DIR: ${{ vars.STORY_BG_DIR }}
      STORY_MAX_SECONDS: ${{ vars.STORY_MAX_SECONDS || '130' }}
      STORY_TARGET_MIN: ${{ vars.STORY_TARGET_MIN }}
      STORY_TARGET_MAX: ${{ vars.STORY_TARGET_MAX }}
      STORY_STORY_GENRES: ${{ vars.STORY_STORY_GENRES }}
      STORY_WHISPER_MODEL: ${{ vars.STORY_WHISPER_MODEL }}
      STORY_PEXELS_API_KEY: ${{ secrets.STORY_PEXELS_API_KEY }}
      EXPLAINER_VOICE: ${{ vars.EXPLAINER_VOICE }}
      EXPLAINER_TTS_RATE: ${{ vars.EXPLAINER_TTS_RATE }}
      EXPLAINER_TTS_PITCH: ${{ vars.EXPLAINER_TTS_PITCH }}
      EXPLAINER_TTS_VOLUME: ${{ vars.EXPLAINER_TTS_VOLUME }}
      EXPLAINER_TTS_ENGINE: ${{ vars.EXPLAINER_TTS_ENGINE }}
      EXPLAINER_GEMINI_TTS_VOICES: ${{ vars.EXPLAINER_GEMINI_TTS_VOICES }}
      EXPLAINER_MIN_AUDIO_SEC: ${{ vars.EXPLAINER_MIN_AUDIO_SEC }}
      EXPLAINER_MAX_AUDIO_SEC: ${{ vars.EXPLAINER_MAX_AUDIO_SEC }}
      EXPLAINER_PEXELS_MIN_WIDTH: ${{ vars.EXPLAINER_PEXELS_MIN_WIDTH }}
      RANKING_VOICE: ${{ vars.RANKING_VOICE }}
      RANKING_TTS_VOICES: ${{ vars.RANKING_TTS_VOICES }}
      RANKING_TTS_RATE: ${{ vars.RANKING_TTS_RATE }}
      RANKING_TTS_PITCH: ${{ vars.RANKING_TTS_PITCH }}
      RANKING_TTS_VOLUME: ${{ vars.RANKING_TTS_VOLUME }}
      RANKING_STILLS_PER_BEAT: ${{ vars.RANKING_STILLS_PER_BEAT }}
      RANKING_MIN_AUDIO_SEC: ${{ vars.RANKING_MIN_AUDIO_SEC }}
      RANKING_MAX_AUDIO_SEC: ${{ vars.RANKING_MAX_AUDIO_SEC }}
      RANKING_PEXELS_MIN_WIDTH: ${{ vars.RANKING_PEXELS_MIN_WIDTH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run pipeline
        run: python pipeline.py
      - name: Commit history (dedup memory for next run)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "chore: record short history [skip ci]"
          git push || echo "history push skipped (nothing to push or no write access)"
      - name: Keep metadata (always, 90 days, tiny text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-metadata
          path: out/*.json
          retention-days: 90
          if-no-files-found: warn
      - name: Keep video (only on failure, 3 days, debug only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: short-video-debug
          path: |
            out/*.mp4
            out/*.mp3
            out/*.srt
          retention-days: 3
          if-no-files-found: warn
