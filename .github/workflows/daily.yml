name: daily-short

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"  # 4x daily: 02:00, 08:00, 14:00, 20:00 UTC
  workflow_dispatch: {}  # manual Run button

# Serialize runs: each run reads+advances series_state.json, so two
# overlapping runs could fork the story. Queue instead of overlap.
concurrency:
  group: series-state
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # needed to commit series_state.json back
    env:
      VISIBILITY: ${{ vars.VISIBILITY || 'private' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run pipeline
        run: python pipeline.py
      - name: Save series state (next episode continuity)
        # Only on success: pipeline saves state only after render+upload.
        # The diff guard makes this a no-op when the fallback ran (no state change).
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add series_state.json
          git diff --staged --quiet || git commit -m "series state Ep advance [skip ci]"
          git pull --rebase --autostash || true
          git push || echo "state push failed (non-fatal, next run re-reads repo state)"
      - name: Keep metadata (always, 90 days, tiny text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-metadata
          path: out/*.json
          retention-days: 90
          if-no-files-found: warn
      - name: Keep video (only on failure, 3 days, debug only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: short-video-debug
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: warn
