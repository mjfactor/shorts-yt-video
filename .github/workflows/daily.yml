name: daily-short

on:
  schedule:
    - cron: "0 6,18 * * *"  # 2x daily: 06:00 + 18:00 PHT (UTC+8) = 22:00 + 10:00 UTC
  workflow_dispatch: {}  # manual Run button

# Runs stay serial: history.json is committed back each run, so overlapping
# runs could repeat a story or clash on push. Serial also avoids
# YouTube upload-quota spikes and artifact name clashes.
concurrency:
  group: shorts-single
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # write = commit history.json back so next run avoids repeats
    env:
      # Single-niche default; to run several niches, fan out with a matrix
      # (e.g. `strategy.matrix.niche: [story, explainer, ranking]`) and set
      # NICHE: ${{ matrix.niche }} instead.
      NICHE: ${{ vars.NICHE || 'story' }}
      VISIBILITY: ${{ vars.VISIBILITY || 'private' }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'edge' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      TTS_MODEL: ${{ vars.TTS_MODEL || 'gemini-3.1-flash-tts-preview' }}
      TTS_VOICES: ${{ vars.TTS_VOICES }}
      NARRATION_SPEED: ${{ vars.NARRATION_SPEED || '1.15' }}
      BG_DIR: ${{ vars.BG_DIR || 'assets/backgrounds/' }}
      CAPTION_UPPER: ${{ vars.CAPTION_UPPER || '0' }}
      CARD_SECONDS: ${{ vars.CARD_SECONDS || '3.0' }}
      CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
      AVATAR_PATH: ${{ vars.AVATAR_PATH || 'assets/avatar.png' }}
      MAX_SECONDS: ${{ vars.MAX_SECONDS || '45' }}
      STORY_GENRES: ${{ vars.STORY_GENRES }}
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'base' }}
      STORY_TTS_MODEL: ${{ vars.STORY_TTS_MODEL || vars.TTS_MODEL || 'gemini-2.5-flash-preview-tts' }}
      STORY_TTS_MODELS: ${{ vars.STORY_TTS_MODELS }}
      STORY_MODELS: ${{ vars.STORY_MODELS }}
      STORY_LITE_RETRIES: ${{ vars.STORY_LITE_RETRIES }}
      STORY_MAX_SECONDS: ${{ vars.STORY_MAX_SECONDS || '130' }}
      # 95, not 100: the model writes ~430-470 words regardless of the
      # window it is given, so a 100s floor (470w) straddles its output and
      # burns retries. Set the repo Variable STORY_TARGET_MIN to override.
      STORY_TARGET_MIN: ${{ vars.STORY_TARGET_MIN || '95' }}
      STORY_TARGET_MAX: ${{ vars.STORY_TARGET_MAX }}
      STORY_NARRATION_SPEED: ${{ vars.STORY_NARRATION_SPEED }}
      STORY_TRIM_CHUNK_SILENCE: ${{ vars.STORY_TRIM_CHUNK_SILENCE }}
      STORY_CHUNK_PAUSE_SEC: ${{ vars.STORY_CHUNK_PAUSE_SEC }}
      STORY_NARRATOR_GENDER_MODE: ${{ vars.STORY_NARRATOR_GENDER_MODE }}
      STORY_CAPTION_UPPER: ${{ vars.STORY_CAPTION_UPPER }}
      STORY_CAPTION_POS_Y: ${{ vars.STORY_CAPTION_POS_Y }}
      STORY_CARD_SECONDS: ${{ vars.STORY_CARD_SECONDS }}
      STORY_CHANNEL_HANDLE: ${{ vars.STORY_CHANNEL_HANDLE }}
      STORY_AVATAR_PATH: ${{ vars.STORY_AVATAR_PATH }}
      STORY_CARD_LIKES: ${{ vars.STORY_CARD_LIKES }}
      STORY_CARD_SHARES: ${{ vars.STORY_CARD_SHARES }}
      STORY_CARD_SHOW_REACTIONS: ${{ vars.STORY_CARD_SHOW_REACTIONS }}
      STORY_BG_DIR: ${{ vars.STORY_BG_DIR }}
      STORY_BG_SINGLE_SPEED: ${{ vars.STORY_BG_SINGLE_SPEED }}
      # Segment count for the background track. 0/1 = one continuous take
      # (legacy path); N>=2 cuts the take into N segments, cycling BG_DIR.
      # Set the repo Variable BGM_SEGMENTS to override the default.
      STORY_BG_SEGMENTS: ${{ vars.BG_SEGMENTS || '3' }}
      STORY_BGM_DIR: ${{ vars.STORY_BGM_DIR }}
      STORY_BGM_VOLUME: ${{ vars.STORY_BGM_VOLUME }}
      STORY_WHISPER_MODEL: ${{ vars.STORY_WHISPER_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Track the repo default branch (main), not a detached HEAD of it:
          # committing on a detached HEAD then rebasing elsewhere caused
          # add/add conflicts on every file and lost history.json.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run pipeline
        run: python pipeline.py
      - name: Commit history (dedup memory for next run)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "chore: record short history [skip ci]"
          # Runs are serial (concurrency), so the branch should not move
          # mid-run. Push the explicit refspec: a bare git push fails on a
          # detached HEAD. One retry absorbs a rare concurrent update.
          BR=${{ github.event.repository.default_branch }}
          git push origin "HEAD:$BR" || {
            git pull --rebase origin "$BR" && git push origin "HEAD:$BR";
          } || echo "history push skipped (nothing to push or no write access)"
      - name: Keep metadata (always, 90 days, tiny text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-metadata
          path: out/*.json
          retention-days: 90
          if-no-files-found: warn
      - name: Keep video (only on failure, 3 days, debug only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: short-video-debug
          path: |
            out/*.mp4
            out/*.mp3
            out/*.srt
          retention-days: 3
          if-no-files-found: warn

