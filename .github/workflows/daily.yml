name: daily-short

on:
  schedule:
    - cron: "0 8,16,23 * * *"  # 3x daily: 08:00, 16:00, 23:00 UTC
  workflow_dispatch: {}  # manual Run button

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NICHE: ${{ vars.NICHE || 'scary true horror stories with cliffhanger' }}
      VOICE: ${{ vars.VOICE || 'en-US-AvaNeural' }}
      VISIBILITY: ${{ vars.VISIBILITY || 'private' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run pipeline
        run: python pipeline.py
      - name: Keep metadata (always, 90 days, tiny text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-metadata
          path: out/*.json
          retention-days: 90
          if-no-files-found: warn
      - name: Keep video (only on failure, 3 days, debug only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: short-video-debug
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: warn
