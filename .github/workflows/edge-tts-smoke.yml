name: edge-tts-smoke

# Manual smoke test for the keyless edge-tts preview path. No schedule,
# no secrets, no uploads: synthesizes the bundled sample, renders the
# SAME story pipeline (planner, card, captions, mix, encode) on
# generated testsrc backgrounds, and keeps the artifacts for review.
on:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # read-only: nothing is committed back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check ffmpeg (install if missing)
        run: |
          # ubuntu-latest runners usually ship ffmpeg, but that is NOT
          # guaranteed (unsure-if-needed): install the `ffmpeg` apt package
          # when the binary is absent. Whether that package's build links
          # libass (the `ass` burn-in filter) is likewise unsure-if-needed,
          # so the render itself preflights the filter and fails clearly.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -2
          ffmpeg -hide_banner -filters | grep -w ass || echo "no ass filter"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run edge preview (bundled sample + testsrc BG, no secrets)
        run: python tools/test_edge_preview.py --card "I said no, then they moved my desk"
      - name: Print evidence (events + captions + ffprobe)
        run: |
          python - <<'EOF'
          import pathlib
          from engine import edge_tts_client as ec
          from engine.ass import write_wordpop_ass
          from engine.srt import write_upload_srt
          from niches.story.narration import _map_edge_words, card_end_time
          import niches.story as S
          c = S.niche.sample_content()
          text = " ".join(c.narration_text.split()[:60])
          tmp = pathlib.Path("/tmp/edge_smoke")
          tmp.mkdir(exist_ok=True)
          evs = ec.synth_sync(text, "en-US-AndrewNeural", "+20%", tmp / "ev.mp3")
          print(f"edge events: {len(evs)} vs words: {len(text.split())}")
          for e in evs[:5]:
              print(f"  {e['word']!r} {e['start']:.3f} -> {e['end']:.3f}")
          words = _map_edge_words(evs, text)
          card_text = "I said no, then they moved my desk"
          ce = card_end_time(words, card_text, text.split(".")[0] + ".")
          write_wordpop_ass(words, "out/edge_preview.ass",
                            key_words=set(), upper=False, start_after=ce)
          write_upload_srt(words, "out/edge_preview.srt")
          print(f"captions: {len(words)} words, card_end {ce:.2f}s")
          EOF
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,sample_rate -of default=noprint_wrappers=1 out/edge_preview.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out/edge_preview.mp4
      - name: Keep preview (mp4 + ASS + SRT)
        uses: actions/upload-artifact@v4
        with:
          name: edge-preview
          path: |
            out/edge_preview.mp4
            out/edge_preview.ass
            out/edge_preview.srt
          retention-days: 7
          if-no-files-found: error
